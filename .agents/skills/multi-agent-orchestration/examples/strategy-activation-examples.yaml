examples:
  - strategy_id: "lead-only-default"
    context:
      task_summary: "Answer a local repository question after reading one file."
      signals: ["small_task"]
    expected_activation:
      candidate_agents: []
      max_agents: 0

  - strategy_id: "parallel-research-swarm"
    context:
      task_summary: "Compare current multi-agent orchestration practices across official docs and papers."
      requires_research: true
      parallelizable: true
      signals: ["multiple_independent_research_threads"]
      source_list:
        - "OpenAI official docs"
        - "Anthropic engineering blog"
        - "academic papers"
      source_priority: "Prefer official docs and primary papers over secondary summaries."
      date_or_version_context: "Use current runtime docs and publication dates when available."
      uncertainty_notes: "Separate source-backed claims from inference."
    expected_activation:
      candidate_agents: ["researcher", "critic", "reviewer"]
      required_evidence: ["source_list", "source_priority", "date_or_version_context", "uncertainty_notes"]

  - strategy_id: "supervisor-router"
    context:
      task_summary: "Route work across repository inspection, policy review, and implementation."
      signals: ["routing_needed", "multiple_domains"]
      lead_analysis: "The task spans repository facts, policy risk, and bounded implementation. Scope boundaries and constraints are needed so specialists do not overlap or escalate permissions."
      routing_reason: "Repository inspection, policy review, and implementation need different scopes."
      agent_scope_boundaries:
        - "codebase-explorer: read-only repository facts"
        - "reviewer: policy and risk review"
        - "implementer: bounded code changes only"
      handoff_constraints:
        - "No specialist may start another strategy."
        - "Lead selects at most four specialists."
    expected_activation:
      candidate_agents: ["codebase-explorer", "researcher", "architect", "implementer", "tester", "reviewer", "critic", "memory-curator"]

  - strategy_id: "sop-assembly-line"
    context:
      task_summary: "Implement a multi-stage feature requiring design, code, tests, and review."
      requires_edit: true
      validation_available: true
      signals: ["multi_stage_delivery"]
      stage_plan:
        - "recover context"
        - "design"
        - "implement"
        - "test"
        - "review"
      stage_exit_gates:
        - "context evidence recorded"
        - "design accepted by lead"
        - "tests pass or deferral recorded"
      validation_path: "Run package checks and targeted strategy examples after implementation."
    expected_activation:
      parallelism: "sequential"
      required_evidence: ["stage_plan", "stage_exit_gates", "validation_path"]

  - strategy_id: "debate-critic-panel"
    context:
      task_summary: "Choose between two durable architecture directions with high failure cost."
      signals: ["high_uncertainty", "high_failure_cost"]
      lead_analysis: "There are two options with safety, maintenance, cost, and evaluation tradeoffs. A critic should challenge assumptions before the lead decides."
      competing_options:
        - "single selector with strategy registry"
        - "distributed per-strategy schedulers"
      decision_criteria:
        - "safety"
        - "maintainability"
        - "runtime cost"
      critique_questions:
        - "Which option creates hidden authority or safety bypass risk?"
        - "Which option is easier to evaluate?"
    expected_activation:
      candidate_agents: ["architect", "critic", "reviewer"]

  - strategy_id: "reviewer-tester-loop"
    context:
      task_summary: "Modify policy and run validation before final report."
      requires_edit: true
      validation_available: true
      diff_scope: "policy and validation docs"
      validation_commands:
        - "npm run validate"
        - "npm run examples"
      review_scope: "Risk review for policy behavior changes."
    expected_activation:
      candidate_agents: ["tester", "reviewer", "critic"]

  - strategy_id: "batch-map-reduce"
    context:
      task_summary: "Scan many independent agent files for schema consistency."
      parallelizable: true
      signals: ["many_independent_items"]
      item_partition:
        - "codex agent TOML files"
        - "skill metadata files"
        - "harness policy files"
      per_item_output_schema:
        item: "string"
        status: "pass|fail"
        findings: "array"
      reduce_rule: "Lead merges per-item findings by severity and removes duplicates."
    expected_activation:
      parallelism: "parallel_map_then_reduce"
      required_evidence: ["item_partition", "per_item_output_schema", "reduce_rule"]

  - strategy_id: "selector-group-chat"
    context:
      task_summary: "Explore a nonlinear investigation where the next useful specialist is not known upfront."
      signals: ["dynamic_next_speaker_needed", "nonlinear_exploration"]
      turn_budget: 4
      speaker_selection_rule: "Lead chooses the next specialist only when the prior output identifies a concrete gap."
      lead_checkpoint_rule: "Lead reviews evidence after every specialist turn and stops when no new evidence appears."
    expected_activation:
      required_evidence: ["turn_budget", "speaker_selection_rule", "lead_checkpoint_rule"]

  - strategy_id: "human-approval-gate"
    context:
      task_summary: "Prepare to delete a production resource."
      operation: "delete"
      target: "production cloud resource"
      sensitive_domains: ["production_deployment", "cloud_resource_deletion"]
      risks: ["destructive cloud delete"]
      safer_alternative: "perform a read-only audit and request exact approval before deletion"
    expected_activation:
      required_evidence: ["exact_operation", "exact_target_path_or_resource", "risk_statement", "safer_alternative"]
      recommended_action: "lead_request_human_approval_before_action"
      safety_gate:
        approval_required: true
        approval_record_valid: false
        approval_record_missing_fields: ["approved", "approver_source", "exact_operation", "exact_target", "timestamp", "risk_acknowledged"]
        approval_record_mismatch: ["approved_not_true", "risk_not_acknowledged"]
        action_may_proceed: false

  - strategy_id: "human-approval-gate"
    context:
      task_summary: "Prepare to delete a production resource after exact approval."
      operation: "delete"
      target: "production cloud resource"
      sensitive_domains: ["production_deployment", "cloud_resource_deletion"]
      risks: ["destructive cloud delete"]
      safer_alternative: "perform a read-only audit and request exact approval before deletion"
      approval_record:
        approved: true
        approver_source: "direct user instruction in current thread"
        exact_operation: "delete"
        exact_target: "production cloud resource"
        timestamp: "2026-05-29T00:00:00Z"
        risk_acknowledged: true
    expected_activation:
      recommended_action: "lead_review_approval_record_before_action"
      safety_gate:
        approval_required: true
        approval_record_valid: true
        approval_record_missing_fields: []
        approval_record_mismatch: []
        action_may_proceed: true

  - strategy_id: "human-approval-gate"
    context:
      task_summary: "delete production database"
    expected_activation:
      eligible: false
      matched_signals: ["high_risk_operation"]
      missing_evidence: ["exact_operation", "exact_target_path_or_resource", "risk_statement", "safer_alternative"]
      recommended_action: "lead_decision_required_no_auto_selection"

  - strategy_id: "batch-map-reduce"
    context:
      task_summary: "Review many files and produce a reduced severity list."
      parallelizable: true
      signals: ["many_independent_items"]
      item_partition:
        - "file group A"
      per_item_output_schema:
        item: "string"
      reduce_rule: "Merge findings by severity."
    expected_activation:
      eligible: true

  - strategy_id: "sop-assembly-line"
    context:
      task_summary: "Plan and implement a staged delivery using Lead judgment instead of rigid fields."
      requires_edit: true
      validation_available: true
      signals: ["multi_stage_delivery"]
      lead_analysis: "The work should run as stages: context recovery, design, implementation, validation, and review. Exit gates are context evidence, lead design acceptance, and test/check results."
    expected_activation:
      eligible: true

  - strategy_id: "selector-group-chat"
    strategy_under_test: "selector-group-chat"
    context:
      task_summary: "Nonlinear investigation without a concrete turn budget."
      signals: ["dynamic_next_speaker_needed", "nonlinear_exploration"]
      lead_analysis: "The next speaker depends on evidence, but no turn budget has been set."
    expected_activation:
      eligible: false
      missing_evidence: ["turn_budget", "speaker_selection_rule", "lead_checkpoint_rule"]

  - strategy_id: "no-eligible-strategy"
    context:
      signals: ["external_research_required"]
    expected_activation:
      eligible: false
      recommended_action: "lead_decision_required_no_auto_selection"

  - strategy_id: "no-eligible-strategy"
    context:
      task_summary: "Answer a tiny question, but the user also asks for external research."
      signals: ["small_task", "external_research_required"]
    expected_activation:
      eligible: false
      recommended_action: "lead_decision_required_no_auto_selection"
