rubric:
  score_scale:
    min: 0.0
    max: 1.0
    anchors:
      "0.0": "Missing or harmful."
      "0.5": "Partially satisfies criterion with material gaps."
      "1.0": "Fully satisfies criterion with evidence."

  scoring_formula:
    weighted_score: "sum(category.weight * criterion.weight * criterion.score) / sum(category.weight * criterion.weight)"
    pass: "weighted_score >= thresholds.pass"
    review_required: "weighted_score >= thresholds.review_required and weighted_score < thresholds.pass"
    fail: "weighted_score < thresholds.review_required"

  categories:
    instruction_compliance:
      weight: 1
      criteria:
        planned_when_needed:
          weight: 1
          description: "The agent planned before non-trivial execution."
        inspected_before_editing:
          weight: 1
          description: "The agent inspected relevant files before modifying them."
        avoided_unrelated_changes:
          weight: 2
          description: "The agent avoided unrelated edits and broad rewrites."
        reported_validation:
          weight: 2
          description: "The agent reported tests/checks run or clearly explained why not run."

    engineering_quality:
      weight: 2
      criteria:
        correctness:
          weight: 3
          description: "The result satisfies the requested behavior."
        maintainability:
          weight: 2
          description: "The solution is simple, readable, and consistent with project conventions."
        minimality:
          weight: 1
          description: "The diff is appropriately small."
        testability:
          weight: 2
          description: "The result is testable and tested when possible."

    harness_quality:
      weight: 1
      criteria:
        context_efficiency:
          weight: 1
          description: "The agent used only relevant context."
        specialist_usage:
          weight: 1
          description: "The agent used or simulated specialists only when useful."
        memory_quality:
          weight: 1
          description: "Memory updates are durable, verified, and low-noise."
        critique_quality:
          weight: 1
          description: "The agent identified risks, assumptions, and validation gaps."

    failure_handling:
      weight: 1
      criteria:
        root_cause_analysis:
          weight: 2
          description: "Failures were analyzed rather than blindly retried."
        honest_uncertainty:
          weight: 2
          description: "The agent did not overclaim uncertain or unverified results."

  thresholds:
    pass: 0.85
    review_required: 0.70
    fail_below: 0.70

  required_evidence:
    - final_response
    - changed_files_or_no_change_record
    - commands_run_or_not_run_reason
    - trace_or_transcript_summary
