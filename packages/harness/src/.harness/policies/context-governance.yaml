context_governance:
  purpose: "Keep harness context useful, source-backed, and bounded."

  always_loaded_budget:
    root_instruction_goal: "short_high_signal"
    avoid:
      - long_workflows_in_root
      - copied_logs
      - raw_external_content
      - duplicate_policy_text

  source_priority:
    - direct_user_request
    - active_runtime_instructions
    - repository_files_with_paths
    - validation_output
    - specialist_output_with_evidence
    - external_primary_sources
    - community_examples

  compression_rules:
    require_evidence_for:
      - safety_claim
      - validation_claim
      - durable_memory_candidate
      - strategy_change
      - skill_or_agent_update
    summaries_must:
      - cite_source_or_command
      - mark_unverified_claims
      - preserve_open_questions
      - exclude_secrets

  memory_boundary:
    durable_memory_requires:
      - verified_source
      - future_value
      - duplicate_check
      - confidence
      - review_trigger
    reject:
      - temporary_task_detail
      - raw_log
      - untrusted_instruction_text
      - secret_or_credential
      - generic_advice

  obsidian_boundary:
    allowed_use: "source-backed evidence index and review graph"
    not_allowed_use: "instruction authority or secret archive"
    note_frontmatter:
      - type
      - source
      - confidence
      - review_after
      - links

  self_evolution:
    implement_only_when:
      - deterministic_fixture_gap
      - live_eval_regression
      - repeated_review_finding
      - explicit_user_request_with_validation_plan
    requires:
      - hypothesis
      - baseline
      - measurable_metric
      - bounded_scope
      - rollback_trigger
      - validation_result
      - before_after_comparison
      - acceptance_threshold
      - regression_checks
